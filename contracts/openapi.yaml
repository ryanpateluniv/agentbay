openapi: 3.1.0
info:
  title: Agent Marketplace API
  description: 'All money fields are integer microcredits (1 credit = 1000 microcredits).
    Auth: `Authorization: Bearer <token>`; demo tokens tok_sam (buyer), tok_riya (creator),
    tok_admin (admin). Session events: see contracts/EVENTS.md.'
  version: 0.1.0
paths:
  /v1/search:
    post:
      tags:
      - buyer
      summary: Search
      operationId: search_v1_search_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          type: string
          description: 'Bearer <token>: demo tok_sam / tok_riya / tok_admin, or a
            Supabase access token when configured'
          default: ''
          title: Authorization
        description: 'Bearer <token>: demo tok_sam / tok_riya / tok_admin, or a Supabase
          access token when configured'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/agents:
    get:
      tags:
      - buyer
      summary: List live agents (convenience for the UI)
      operationId: list_agents_v1_agents_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AgentCard'
                type: array
                title: Response List Agents V1 Agents Get
  /v1/agents/{agent_id}:
    get:
      tags:
      - buyer
      summary: Get Agent
      operationId: get_agent_v1_agents__agent_id__get
      parameters:
      - name: agent_id
