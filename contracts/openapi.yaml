  /v1/sessions/{session_id}/events:
    get:
      tags:
      - buyer
      summary: SSE stream (see contracts/EVENTS.md)
      description: 'Named frames by default (`event: <type>`, data = {id, type, role,
        ts, data}). `flat=true` (implied by

        `?access_token=`, which the bundled frontend uses) sends unnamed frames with
        the payload flattened and

        `*_credits` conveniences, so `EventSource.onmessage` sees every event.'
      operationId: session_events_v1_sessions__session_id__events_get
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      - name: token
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Token
      - name: access_token
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Access Token
      - name: flat
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Flat
      - name: last-event-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Last-Event-Id
      responses:
        '200':
          description: text/event-stream; `?token=` accepted because EventSource cannot
            set headers
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
