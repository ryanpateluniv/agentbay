          anyOf:
          - type: string
          - type: 'null'
          title: Source Path
          description: 'local path or repo dir containing agent.yaml (MVP: local path)'
        repo_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Repo Url
        image_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Image Ref
        manifest:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
