        cap_microcredits:
          type: integer
          title: Cap Microcredits
        llm_calls:
          type: integer
          title: Llm Calls
        tool_calls:
          type: integer
          title: Tool Calls
        input_tokens:
          type: integer
          title: Input Tokens
        output_tokens:
          type: integer
          title: Output Tokens
