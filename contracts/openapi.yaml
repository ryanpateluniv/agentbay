      title: VersionSubmit
    WalletOut:
      properties:
        user_id:
          type: string
          title: User Id
        balance_microcredits:
          type: integer
          title: Balance Microcredits
        held_microcredits:
          type: integer
          title: Held Microcredits
          description: currently in escrow for running sessions
        history:
          items:
            additionalProperties: true
            type: object
          type: array
          title: History
        user:
          type: string
          title: User
          default: ''
        email:
          type: string
          title: Email
          default: ''
        balance_credits:
          type: number
          title: Balance Credits
          default: 0
        granted_credits:
          type: number
          title: Granted Credits
          description: all credits ever added (promo + purchases)
          default: 0
        used_credits:
          type: number
          title: Used Credits
          description: granted - balance - held
          default: 0
