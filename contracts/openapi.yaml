          description: Conflict
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - buyer
      summary: 'Buyer''s session history: {sessions: [SessionOut + title, active,
